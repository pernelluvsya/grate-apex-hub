<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biochemistry — 180-Question Mock Exam</title>
  <style>
    :root {
      --ink: #0F1B2A;
      --paper: #F4F8FF;
      --panel: #FFFFFF;
      --blue: #0B4DDA;
      --blue-deep: #052E7A;
      --blue-soft: #e9f0ff;
      --line: #c7d6f7;
      --accent: #1E6FEE;
      --gray: #6b7280;
      --gray-light: #e5e7eb;
      --green: #0a8f4a;
      --green-bg: #e6f7ee;
      --red: #c81e3a;
      --red-bg: #fdecef;
      --ar: #8a3ec1;
      --ar-bg: #f2e6ff;
      --mc: #c1670c;
      --mc-bg: #fff1e0;
      --mcq: #0a7d8c;
      --mcq-bg: #e2f7fa;
      --shadow: 0 8px 24px rgba(5, 46, 122, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--blue-soft) 0%, var(--paper) 320px);
      color: #101225;
      min-height: 100%;
    }

    header.app-header {
      background: linear-gradient(120deg, var(--blue-deep) 0%, var(--blue) 100%);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-text h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
    }

    .brand-text p {
      margin: 0;
      font-size: 11.5px;
      color: #D9E6FF;
    }

    .nav-btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.32);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    #setupScreen {
      background: var(--panel);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px 22px;
    }

    #setupScreen h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      color: var(--blue-deep);
    }

    #setupScreen .setup-sub {
      font-size: 0.88rem;
      color: var(--gray);
      margin: 0 0 20px;
      line-height: 1.6;
    }

    .setup-group {
      margin-bottom: 20px;
    }

    .setup-label {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--blue-deep);
      margin-bottom: 10px;
      display: block;
    }

    .setup-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .setup-chip {
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--blue-deep);
      background: var(--blue-soft);
    }

    .setup-chip.selected {
      border-color: var(--blue-deep);
      background: var(--blue-deep);
      color: #fff;
    }

    .section-summary {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 6px;
    }

    .section-summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .section-summary-item.ar {
      background: var(--ar-bg);
      color: #5a1d8f;
    }

    .section-summary-item.mc {
      background: var(--mc-bg);
      color: #8a4708;
    }

    .section-summary-item.mcq {
      background: var(--mcq-bg);
      color: #075966;
    }

    #startTestBtn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      background: linear-gradient(120deg, var(--blue-deep), var(--blue));
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 8px 18px rgba(5, 46, 122, 0.3);
    }

    #quizArea {
      display: none;
    }

    .progress-wrap {
      margin: 0 0 18px;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--gray-light);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue-deep));
      border-radius: 6px;
      transition: width .25s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--gray);
      margin-top: 6px;
    }

    .score-pill {
      background: #fff;
      border: 1px solid var(--gray-light);
      border-radius: 20px;
      padding: 4px 12px;
      font-weight: 700;
      color: var(--blue-deep);
    }

    .qcard {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px 20px;
    }

    .sec-badge {
      display: inline-block;
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
      margin-right: 6px;
      text-transform: uppercase;
    }

    .sec-badge.ar {
      background: var(--ar-bg);
      color: var(--ar);
      border: 1px solid #dcb8f5;
    }

    .sec-badge.mc {
      background: var(--mc-bg);
      color: var(--mc);
      border: 1px solid #f5cf9e;
    }

    .sec-badge.mcq {
      background: var(--mcq-bg);
      color: var(--mcq);
      border: 1px solid #9edbe3;
    }

    .q-num-badge {
      display: inline-block;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid var(--line);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
      margin-right: 6px;
    }

    .ar-block {
      margin-bottom: 14px;
    }

    .ar-line {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .ar-tag {
      flex: 0 0 auto;
      font-weight: 800;
      font-size: 0.78rem;
      color: var(--ar);
      background: var(--ar-bg);
      border-radius: 6px;
      padding: 2px 8px;
      height: fit-content;
    }

    .ar-text {
      font-size: 1.02rem;
      font-weight: 600;
      color: #101225;
    }

    .stem {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #101225;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .mc-items {
      background: var(--mc-bg);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .mc-items div {
      font-size: 0.92rem;
      padding: 3px 0;
      color: #5c3405;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      margin-bottom: 9px;
      cursor: pointer;
      background: var(--blue-soft);
      transition: border-color .12s ease;
    }

    .option:hover {
      border-color: var(--accent);
    }

    .option.selected {
      border-color: var(--blue);
      background: #dbe7ff;
    }

    .option.locked {
      cursor: default;
    }

    .option.result-correct {
      border-color: var(--green);
      background: var(--green-bg);
    }

    .option.result-incorrect {
      border-color: var(--red);
      background: var(--red-bg);
    }

    .opt-letter {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--blue);
      background: #fff;
    }

    .option.result-correct .opt-letter {
      border-color: var(--green);
      color: var(--green);
    }

    .option.result-incorrect .opt-letter {
      border-color: var(--red);
      color: var(--red);
    }

    .opt-text {
      flex: 1;
      font-size: 0.92rem;
      line-height: 1.5;
      padding-top: 2px;
    }

    .explain-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.6;
      background: var(--blue-soft);
      color: #0d2a5c;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.86rem;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
    }

    .btn-check {
      background: linear-gradient(120deg, var(--blue-deep), var(--blue));
      color: #fff;
      box-shadow: 0 8px 18px rgba(5, 46, 122, 0.3);
    }

    .btn-check:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: #fff;
      color: var(--blue-deep);
      border: 1.5px solid var(--line);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-submit {
      background: linear-gradient(120deg, #8c1229, var(--red));
      color: #fff;
      box-shadow: 0 8px 18px rgba(200, 30, 58, 0.3);
      margin-left: auto;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 46, 122, 0.55);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 100;
      padding: 40px 16px;
      overflow-y: auto;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 780px;
      max-height: 600px;
      border-radius: 18px;
      padding: 20px;
      overflow-y: auto;
    }

    @media(min-width:780px) {
      .modal-overlay {
        align-items: center;
      }

      .modal {
        max-height: 78vh;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 17px;
      color: var(--blue-deep);
    }

    .close-btn {
      background: var(--gray-light);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      color: #333;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 16px;
      font-size: 11.5px;
      color: var(--gray);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }

    .qgrid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    @media(min-width:500px) {
      .qgrid {
        grid-template-columns: repeat(9, 1fr);
      }
    }

    .qgrid button {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1.5px solid var(--gray-light);
      background: #fff;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      color: #333;
    }

    .qgrid button.answered {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: var(--blue-deep);
    }

    .qgrid button.answered-correct {
      background: var(--green-bg);
      border-color: var(--green);
      color: #0a5c33;
    }

    .qgrid button.answered-incorrect {
      background: var(--red-bg);
      border-color: var(--red);
      color: #8c1229;
    }

    .qgrid button.current {
      outline: 2.5px solid var(--blue);
      outline-offset: 1px;
    }

    .qgrid button.sec-ar {
      border-left: 3px solid var(--ar);
    }

    .qgrid button.sec-mc {
      border-left: 3px solid var(--mc);
    }

    .qgrid button.sec-mcq {
      border-left: 3px solid var(--mcq);
    }

    #resultsOverlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 46, 122, 0.55);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      z-index: 110;
      overflow-y: auto;
    }

    #resultsOverlay.show {
      display: flex;
    }

    #resultsPanel {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      margin: 30px 0;
    }

    .results-emoji {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .results-title {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--blue-deep);
      margin-bottom: 10px;
    }

    .results-score {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--blue);
      margin-bottom: 4px;
    }

    .results-breakdown {
      font-size: 0.82rem;
      color: var(--gray);
      margin-bottom: 20px;
      line-height: 1.7;
      text-align: left;
      background: var(--blue-soft);
      border-radius: 10px;
      padding: 12px 16px;
    }

    .results-breakdown div {
      display: flex;
      justify-content: space-between;
    }

    #resumeOverlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 46, 122, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 20px;
    }

    #resumeOverlay .panel {
      background: #fff;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 30px 26px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    @media (max-width:520px) {
      main {
        padding: 14px 12px 70px;
      }

      .app-header {
        padding-left: 14px;
        padding-right: 14px;
      }

      .qcard {
        padding: 16px 14px;
      }

      .stem,
      .ar-text {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <h1>Coming Soon</h1>
  </div>

</body>

</html>
